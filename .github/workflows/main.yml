name: Compilar mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - run: gradle build
        working-directory: monstruosmod-github-build
      - uses: actions/upload-artifact@v4
        with:
          name: monstruosmod-jar
          path: monstruosmod-github-build/build/libs/*.jar
